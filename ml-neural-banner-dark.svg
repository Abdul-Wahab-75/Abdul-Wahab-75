<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#10162a"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSpot2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D sphere gradients for nodes -->
    <radialGradient id="node1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <radialGradient id="node2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>
    <radialGradient id="node3" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="220" rx="18" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  <rect width="900" height="220" rx="18" fill="url(#glowSpot)"/>
  <rect width="900" height="220" rx="18" fill="url(#glowSpot2)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#242c45" stroke-width="1.5"/>

  <!-- floating grid dots for depth -->
  <g fill="#334155" opacity="0.35">
    <circle cx="60" cy="30" r="1.4"/>
    <circle cx="90" cy="190" r="1.4"/>
    <circle cx="600" cy="25" r="1.4"/>
    <circle cx="850" cy="55" r="1.4"/>
    <circle cx="820" cy="185" r="1.4"/>
    <circle cx="480" cy="195" r="1.4"/>
  </g>

  <!-- network -->
  <g id="network">
    <g stroke="url(#lineGrad)" stroke-width="1.4">
      <line x1="120" y1="55"  x2="290" y2="45"/>
      <line x1="120" y1="55"  x2="290" y2="110"/>
      <line x1="120" y1="55"  x2="290" y2="175"/>
      <line x1="120" y1="110" x2="290" y2="45"/>
      <line x1="120" y1="110" x2="290" y2="110"/>
      <line x1="120" y1="110" x2="290" y2="175"/>
      <line x1="120" y1="165" x2="290" y2="45"/>
      <line x1="120" y1="165" x2="290" y2="110"/>
      <line x1="120" y1="165" x2="290" y2="175"/>
    </g>
    <g stroke="url(#lineGrad)" stroke-width="1.4">
      <line x1="290" y1="45"  x2="440" y2="80"/>
      <line x1="290" y1="45"  x2="440" y2="140"/>
      <line x1="290" y1="110" x2="440" y2="80"/>
      <line x1="290" y1="110" x2="440" y2="140"/>
      <line x1="290" y1="175" x2="440" y2="80"/>
      <line x1="290" y1="175" x2="440" y2="140"/>
    </g>

    <!-- traveling signal pulses along connections -->
    <circle r="3" fill="#5eead4" filter="url(#softGlow)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M120,55 L290,110 L440,80"/>
    </circle>
    <circle r="3" fill="#a5b4fc" filter="url(#softGlow)">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M120,165 L290,45 L440,140"/>
    </circle>
    <circle r="3" fill="#5eead4" filter="url(#softGlow)">
      <animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" path="M120,110 L290,175 L440,80"/>
    </circle>

    <!-- layer 1 nodes -->
    <circle cx="120" cy="55"  r="9" fill="url(#node1)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="110" r="9" fill="url(#node1)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="165" r="9" fill="url(#node1)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <!-- layer 2 nodes -->
    <circle cx="290" cy="45"  r="9" fill="url(#node2)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="110" r="9" fill="url(#node2)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="175" r="9" fill="url(#node2)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- output nodes -->
    <circle cx="440" cy="80"  r="10" fill="url(#node3)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="140" r="10" fill="url(#node3)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text block -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="500" y="95" font-size="30" font-weight="700" fill="url(#textGrad)">AI &amp; ML Engineer</text>
    <text x="500" y="128" font-size="15" fill="#94a3b8">Building models that learn, generalize, and ship</text>

    <text x="500" y="160" font-size="14" fill="#cbd5e1" font-family="'Courier New', monospace">
      <tspan>&gt; training_status: </tspan><tspan fill="#5eead4" font-weight="600">converged ✓</tspan>
    </text>
  </g>

  <!-- bottom accent -->
  <rect x="0" y="216" width="900" height="4" rx="2" fill="url(#textGrad)" opacity="0.85"/>
</svg>
