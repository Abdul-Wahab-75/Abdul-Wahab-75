<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Abdul Wahab — AI ML Software Engineering</title>
  <desc id="desc">Professional GitHub profile banner for an AI and machine learning focused software engineer and full-stack developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/>
      <stop offset="0.55" stop-color="#07162B"/>
      <stop offset="1" stop-color="#03111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3A7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#1683FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1683FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7DD3FC" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="418" rx="23" fill="none" stroke="#1D4ED8" stroke-opacity=".65"/>
  <rect width="1600" height="420" rx="24" fill="url(#grid)"/>

  <circle cx="1330" cy="115" r="250" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="150" cy="350" r="220" fill="url(#glow)" filter="url(#blur)" opacity=".55"/>

  <!-- Neural network -->
  <g fill="none" stroke="#38BDF8" stroke-opacity=".34" stroke-width="2">
    <path d="M1110 92L1210 155L1325 88L1435 150L1535 82"/>
    <path d="M1110 92L1190 245L1325 88L1375 270L1535 82"/>
    <path d="M1210 155L1190 245L1435 150L1375 270L1535 82"/>
    <path d="M1190 245L1295 350L1435 150L1515 315"/>
    <path d="M1375 270L1515 315"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="1110" cy="92" r="5"/><circle cx="1210" cy="155" r="5"/>
    <circle cx="1325" cy="88" r="6"/><circle cx="1435" cy="150" r="5"/>
    <circle cx="1535" cy="82" r="6"/><circle cx="1190" cy="245" r="5"/>
    <circle cx="1375" cy="270" r="6"/><circle cx="1295" cy="350" r="5"/>
    <circle cx="1515" cy="315" r="5"/>
  </g>

  <!-- Code window -->
  <g transform="translate(1030 245)" filter="url(#shadow)">
    <rect width="440" height="120" rx="14" fill="#071426" stroke="#1E5EFF" stroke-opacity=".55"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/><circle cx="38" cy="19" r="5" fill="#F59E0B"/><circle cx="56" cy="19" r="5" fill="#22C55E"/>
    <text x="24" y="55" font-family="monospace" font-size="14" fill="#64748B">$ build --profile</text>
    <text x="24" y="80" font-family="monospace" font-size="14" fill="#38BDF8">AI/ML</text>
    <text x="88" y="80" font-family="monospace" font-size="14" fill="#CBD5E1">+</text>
    <text x="105" y="80" font-family="monospace" font-size="14" fill="#22D3A7">SOFTWARE</text>
    <text x="24" y="102" font-family="monospace" font-size="13" fill="#94A3B8">models → products → deployment</text>
  </g>

  <g transform="translate(86 76)">
    <text x="0" y="0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="#F8FAFC">Mohammed Abdul</text>
    <text x="0" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" fill="url(#accent)">Wahab</text>
    <rect x="2" y="92" width="600" height="3" rx="2" fill="url(#accent)"/>
    <text x="0" y="133" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">AI/ML Engineer  ·  Software Engineer  ·  Full-Stack Developer</text>
    <text x="0" y="171" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#94A3B8">Machine Learning • Computer Vision • NLP • Cybersecurity • Web Applications</text>

    <g transform="translate(0 205)">
      <rect width="175" height="42" rx="21" fill="#0B1E36" stroke="#2563EB"/>
      <text x="87" y="27" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7DD3FC">ARTIFICIAL INTELLIGENCE</text>
      <rect x="190" width="145" height="42" rx="21" fill="#0B1E36" stroke="#2563EB"/>
      <text x="262" y="27" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7DD3FC">SOFTWARE</text>
      <rect x="350" width="145" height="42" rx="21" fill="#0B1E36" stroke="#0EA5A4"/>
      <text x="422" y="27" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5EEAD4">CYBER + WEB</text>
    </g>
  </g>

  <path d="M0 402 C260 355 420 455 700 395 S1160 350 1600 402" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
</svg>